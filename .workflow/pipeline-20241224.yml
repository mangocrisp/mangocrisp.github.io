version: '1.0'
name: pipeline-20241224
displayName: pipeline-20241224
triggers:
  trigger: auto
  push:
    branches:
      precise:
        - main
stages:
  - name: stage-cd51c721
    displayName: 打包
    strategy: naturally
    trigger: auto
    executor: []
    steps:
      - step: build@nodejs
        name: build_nodejs
        displayName: Nodejs 构建
        nodeVersion: 18.16.0
        commands:
          - '# 设置NPM源，提升安装速度'
          - npm config set registry https://registry.npmmirror.com
          - corepack enable
          - corepack prepare pnpm@latest-9 --activate
          - pnpm config set store-dir .pnpm-store
          - pnpm install --frozen-lockfile
          - pnpm run docs:build
          - rm -rf public
          - mv src/.vuepress/dist public
        artifacts:
          - name: BUILD_ARTIFACT
            path:
              - ./dist
        caches:
          - ~/.pnpm-lock.yaml
        notify: []
        strategy:
          retry: '0'
